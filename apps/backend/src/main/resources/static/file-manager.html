<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziboto File Manager - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .auth-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .auth-section h2 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .status {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .file-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .action-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .action-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .action-card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .file-list {
            margin-top: 30px;
        }
        
        .file-list h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .file-item:hover {
            background: #f9fafb;
            border-color: #667eea;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-meta {
            font-size: 12px;
            color: #6b7280;
        }
        
        .file-actions-btn {
            display: flex;
            gap: 10px;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .folder-breadcrumb {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #6b7280;
        }
        
        .folder-breadcrumb span {
            color: #667eea;
            cursor: pointer;
        }
        
        .folder-breadcrumb span:hover {
            text-decoration: underline;
        }
        
        .progress {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗂️ Ziboto File Manager</h1>
            <p>Test Interface for File Management System v1.0</p>
        </div>
        
        <div class="content">
            <!-- Auth Section -->
            <div class="auth-section">
                <h2>🔐 Authentication</h2>
                <div class="form-group">
                    <label>JWT Token:</label>
                    <input type="text" id="jwtToken" placeholder="Paste your JWT token here (from login)">
                </div>
                <button class="btn btn-secondary" onclick="testAuth()">Test Authentication</button>
            </div>
            
            <!-- Status Message -->
            <div id="status" class="status"></div>
            
            <!-- Current Folder -->
            <div class="folder-breadcrumb">
                📁 Current Folder: <span id="breadcrumb">/ (Root)</span>
            </div>
            
            <!-- File Actions -->
            <div class="file-actions">
                <!-- Upload File -->
                <div class="action-card">
                    <h3>📤 Upload File</h3>
                    <div class="form-group">
                        <input type="file" id="fileInput">
                    </div>
                    <button class="btn btn-primary" onclick="uploadFile()">Upload</button>
                    <div id="uploadProgress" class="progress">
                        <div id="uploadProgressBar" class="progress-bar">0%</div>
                    </div>
                </div>
                
                <!-- Create Folder -->
                <div class="action-card">
                    <h3>📁 Create Folder</h3>
                    <div class="form-group">
                        <input type="text" id="folderName" placeholder="Folder name">
                    </div>
                    <button class="btn btn-success" onclick="createFolder()">Create</button>
                </div>
                
                <!-- Search Files -->
                <div class="action-card">
                    <h3>🔍 Search Files</h3>
                    <div class="form-group">
                        <input type="text" id="searchQuery" placeholder="Search by filename">
                    </div>
                    <button class="btn btn-primary" onclick="searchFiles()">Search</button>
                </div>
            </div>
            
            <!-- File List -->
            <div class="file-list">
                <h2>📋 Files & Folders</h2>
                <button class="btn btn-secondary btn-sm" onclick="listFiles()" style="margin-bottom: 15px;">
                    🔄 Refresh
                </button>
                <div id="fileListContainer">
                    <p style="color: #6b7280; text-align: center; padding: 40px;">
                        Click "Refresh" to load files
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        let currentFolderId = null;
        
        function getToken() {
            return document.getElementById('jwtToken').value.trim();
        }
        
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'success');
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }
        
        async function testAuth() {
            const token = getToken();
            if (!token) {
                showStatus('Please enter a JWT token', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showStatus(`✅ Authenticated as: ${data.data.email}`);
                    listFiles();
                } else {
                    showStatus('❌ Invalid or expired token', true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function uploadFile() {
            const token = getToken();
            const fileInput = document.getElementById('fileInput');
            
            if (!token) {
                showStatus('Please enter JWT token first', true);
                return;
            }
            
            if (!fileInput.files.length) {
                showStatus('Please select a file', true);
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            if (currentFolderId) {
                formData.append('folderId', currentFolderId);
            }
            
            const progress = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('uploadProgressBar');
            progress.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            
            try {
                const response = await fetch(`${API_BASE}/files/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus(`✅ File uploaded: ${data.data.fileName}`);
                    fileInput.value = '';
                    listFiles();
                } else {
                    showStatus(`❌ Upload failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            } finally {
                setTimeout(() => {
                    progress.style.display = 'none';
                }, 2000);
            }
        }
        
        async function createFolder() {
            const token = getToken();
            const folderName = document.getElementById('folderName').value.trim();
            
            if (!token) {
                showStatus('Please enter JWT token first', true);
                return;
            }
            
            if (!folderName) {
                showStatus('Please enter folder name', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/folders`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        folderName: folderName,
                        parentFolderId: currentFolderId
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus(`✅ Folder created: ${data.data.folderName}`);
                    document.getElementById('folderName').value = '';
                    listFiles();
                } else {
                    showStatus(`❌ Failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function listFiles() {
            const token = getToken();
            if (!token) {
                showStatus('Please enter JWT token first', true);
                return;
            }
            
            try {
                const url = currentFolderId 
                    ? `${API_BASE}/files?folderId=${currentFolderId}`
                    : `${API_BASE}/files`;
                    
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayFiles(data.data.content);
                    
                    // Also list folders
                    const folderUrl = currentFolderId
                        ? `${API_BASE}/folders?parentFolderId=${currentFolderId}`
                        : `${API_BASE}/folders`;
                    
                    const folderResponse = await fetch(folderUrl, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const folderData = await folderResponse.json();
                    if (folderResponse.ok) {
                        displayFolders(folderData.data);
                    }
                } else {
                    showStatus(`❌ Failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        function displayFolders(folders) {
            const container = document.getElementById('fileListContainer');
            
            if (!folders || folders.length === 0) return;
            
            folders.forEach(folder => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">📁 ${folder.folderName}</div>
                        <div class="file-meta">
                            ${folder.fileCount} files · ${folder.subfolderCount} subfolders
                        </div>
                    </div>
                    <div class="file-actions-btn">
                        <button class="btn btn-primary btn-sm" onclick="openFolder('${folder.folderId}', '${folder.folderName}')">Open</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteFolder('${folder.folderId}')">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        function displayFiles(files) {
            const container = document.getElementById('fileListContainer');
            container.innerHTML = '';
            
            if (!files || files.length === 0) {
                container.innerHTML = '<p style="color: #6b7280; text-align: center; padding: 40px;">No files found</p>';
                return;
            }
            
            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">📄 ${file.fileName}</div>
                        <div class="file-meta">
                            ${file.formattedFileSize} · ${file.mimeType} · 
                            ${new Date(file.uploadedAt).toLocaleString()}
                        </div>
                    </div>
                    <div class="file-actions-btn">
                        <button class="btn btn-primary btn-sm" onclick="downloadFile('${file.fileId}', '${file.fileName}')">Download</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteFile('${file.fileId}')">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById('breadcrumb').textContent = `/ ${folderName}`;
            listFiles();
        }
        
        function goToRoot() {
            currentFolderId = null;
            document.getElementById('breadcrumb').textContent = '/ (Root)';
            listFiles();
        }
        
        async function downloadFile(fileId, fileName) {
            const token = getToken();
            
            try {
                const response = await fetch(`${API_BASE}/files/${fileId}/download`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showStatus(`✅ Downloaded: ${fileName}`);
                } else {
                    showStatus('❌ Download failed', true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function deleteFile(fileId) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            
            const token = getToken();
            
            try {
                const response = await fetch(`${API_BASE}/files/${fileId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ File deleted');
                    listFiles();
                } else {
                    showStatus(`❌ Failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function deleteFolder(folderId) {
            if (!confirm('Are you sure? This will delete the folder and ALL its contents!')) return;
            
            const token = getToken();
            
            try {
                const response = await fetch(`${API_BASE}/folders/${folderId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ Folder deleted');
                    listFiles();
                } else {
                    showStatus(`❌ Failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function searchFiles() {
            const token = getToken();
            const query = document.getElementById('searchQuery').value.trim();
            
            if (!token) {
                showStatus('Please enter JWT token first', true);
                return;
            }
            
            if (!query) {
                showStatus('Please enter search query', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/files/search?q=${encodeURIComponent(query)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayFiles(data.data.content);
                    showStatus(`✅ Found ${data.data.content.length} files`);
                } else {
                    showStatus(`❌ Search failed: ${data.message}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
        
        // Make breadcrumb clickable
        document.getElementById('breadcrumb').onclick = goToRoot;
    </script>
</body>
</html>
