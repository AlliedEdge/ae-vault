# Nginx Configuration for Ziboto Backend Load Balancing
# Production-ready setup with SSL/TLS, rate limiting, and health checks

# User and worker configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting zones
    # Login endpoint: 10 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    
    # Registration endpoint: 5 requests per hour per IP
    limit_req_zone $binary_remote_addr zone=signup_limit:10m rate=5r/h;
    
    # Token refresh: 20 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=20r/m;
    
    # General API: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream backend servers
    upstream spring_boot_backend {
        # Load balancing strategy: least_conn (route to server with fewest connections)
        # Alternative strategies: ip_hash (sticky sessions), round_robin (default)
        least_conn;
        
        # Backend server instances
        server spring-boot-1:8081 max_fails=3 fail_timeout=30s weight=1;
        server spring-boot-2:8082 max_fails=3 fail_timeout=30s weight=1;
        server spring-boot-3:8083 max_fails=3 fail_timeout=30s weight=1;
        
        # Keep persistent connections to backend
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Health check upstream (separate for monitoring)
    upstream health_check {
        server spring-boot-1:8081;
        server spring-boot-2:8082;
        server spring-boot-3:8083;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.ziboto.com;

        # Allow Let's Encrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server - main application
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.ziboto.com;

        # SSL certificate configuration
        ssl_certificate /etc/ssl/certs/ziboto.crt;
        ssl_certificate_key /etc/ssl/private/ziboto.key;
        
        # SSL protocols and ciphers (Mozilla Modern configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session configuration
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # Client body size limit (for file uploads)
        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        # Buffer sizes
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Root location - health check endpoint (no rate limiting)
        location = /actuator/health {
            access_log off;
            
            proxy_pass http://spring_boot_backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Authentication endpoints with rate limiting
        location /api/v1/auth/login {
            # Rate limiting: 10 requests per minute, burst of 5
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;
            
            # Connection limiting: max 10 concurrent connections per IP
            limit_conn addr 10;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Custom error page for rate limiting
            error_page 429 = @rate_limit_error;
        }

        location /api/v1/auth/register {
            # Rate limiting: 5 requests per hour, burst of 2
            limit_req zone=signup_limit burst=2 nodelay;
            limit_req_status 429;
            
            limit_conn addr 5;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            error_page 429 = @rate_limit_error;
        }

        location /api/v1/auth/refresh {
            # Rate limiting: 20 requests per minute, burst of 10
            limit_req zone=refresh_limit burst=10 nodelay;
            limit_req_status 429;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            error_page 429 = @rate_limit_error;
        }

        # General auth endpoints (logout, verify)
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # General API endpoints
        location /api/v1/ {
            # General rate limiting: 100 requests per minute, burst of 30
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            
            limit_conn addr 20;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Actuator endpoints (internal monitoring)
        location /actuator/ {
            # Restrict to internal network only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API documentation endpoints
        location ~ ^/(swagger-ui|api-docs|v3/api-docs) {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom rate limit error page
        location @rate_limit_error {
            default_type application/json;
            return 429 '{"success":false,"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please try again later.","timestamp":"$time_iso8601"},"data":null}';
        }

        # Error pages
        error_page 502 503 504 @backend_error;
        location @backend_error {
            default_type application/json;
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable. Please try again later.","timestamp":"$time_iso8601"},"data":null}';
        }
    }

    # Internal health check server (for load balancer health checks)
    server {
        listen 8090;
        server_name _;
        
        access_log off;
        
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /nginx-status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
