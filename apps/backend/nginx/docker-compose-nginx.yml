version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ziboto-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"  # Health check port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
      - nginx-logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - spring-boot-1
      - spring-boot-2
      - spring-boot-3
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Spring Boot Instance 1
  spring-boot-1:
    image: ziboto-backend:latest
    container_name: spring-boot-1
    environment:
      - SERVER_PORT=8081
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ziboto
      - DATABASE_USERNAME=ziboto
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=production
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Spring Boot Instance 2
  spring-boot-2:
    image: ziboto-backend:latest
    container_name: spring-boot-2
    environment:
      - SERVER_PORT=8082
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ziboto
      - DATABASE_USERNAME=ziboto
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=production
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - redis
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Spring Boot Instance 3
  spring-boot-3:
    image: ziboto-backend:latest
    container_name: spring-boot-3
    environment:
      - SERVER_PORT=8083
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ziboto
      - DATABASE_USERNAME=ziboto
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=production
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ziboto-postgres
    environment:
      - POSTGRES_DB=ziboto
      - POSTGRES_USER=ziboto
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziboto"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ziboto-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - ziboto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot
    container_name: ziboto-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ziboto-network

networks:
  ziboto-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nginx-logs:
  certbot-webroot:
