version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ziboto-postgres
    environment:
      POSTGRES_DB: ziboto
      POSTGRES_USER: ziboto
      POSTGRES_PASSWORD: ziboto
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ziboto-network

  redis:
    image: redis:7-alpine
    container_name: ziboto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ziboto-network

volumes:
  postgres-data:
  redis-data:

networks:
  ziboto-network:
    driver: bridge
